    <!-- Anti-FOUC: set theme before first paint. Stored choice wins, then the
         OS preference, then dark — which is what this audience runs and what
         the site shipped before. -->
    <script>
      (function () {
        var stored = localStorage.getItem('gl-theme');
        var dark = stored
          ? stored === 'dark'
          : !window.matchMedia('(prefers-color-scheme: light)').matches;
        var root = document.documentElement;
        root.classList.toggle('dark', dark);
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <!--
      THESIS: a code-hosting surface a developer already knows how to read,
      whose one difference is that every push here carries a verifiable
      signature. Refuses a bespoke visual conceit; the craft goes into density,
      hierarchy, and detail. Chosen by the user over a distinctive direction.
      OWN-WORLD: forge convention at Sourcegraph/GitHub level — neutral greys
      carrying the page, one blue accent for interaction, green/red/amber for
      status, 6px radii, hairline borders, system UI stack with mono for code.
      STORY: a skeptic recognises the surface instantly, reads live signed
      pushes and their certificates, and clones a repository.
      FIRST VIEWPORT: node identity and live counts across the head, the newest
      signed ref-update with its certificate beneath, clone command to hand.
      FORM: the category standard, played straight — the standing exit taken
      from direction round 865d8da2.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, DESIGN.md, and every shipping raster
      carrying its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
